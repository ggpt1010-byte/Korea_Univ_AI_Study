name: 첫 화면 찍기

on:
  push:
    branches: [main]
    paths: ['data/projects.json', 'assets/config.js']
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      all:
        description: '첫 화면을 전부 다시 찍기'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 찍을 것이 있는지 확인
        id: check
        run: node scripts/capture.mjs --check ${{ inputs.all && '--all' || '' }}
      - name: 브라우저 준비
        if: steps.check.outputs.need == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: 첫 화면 찍기
        if: steps.check.outputs.need == 'true'
        run: node scripts/capture.mjs ${{ inputs.all && '--all' || '' }}
      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shots data/capture-failed.json
          git diff --cached --quiet || git commit -m "첫 화면 이미지 갱신"
          git push
