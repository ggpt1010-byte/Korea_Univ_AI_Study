name: 체험 링크 첫 화면 찍기

on:
  push:
    branches: [main]
    paths: ['data/projects.json']
  workflow_dispatch:
    inputs:
      all:
        description: '전부 다시 찍기'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node scripts/capture.mjs ${{ inputs.all && '--all' || '' }}
      - name: 찍은 이미지 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shots
          git diff --cached --quiet || git commit -m "체험 링크 첫 화면 이미지 갱신"
          git push
